# Deploy the first-party registry service (first-party registry R5.3,
# bynk-lang/bynk#2392; re-targeted by R7, bynk-lang/bynk#2415).
#
# Manual only (E4), and only a release (D11): `deploy-guard.sh` refuses any ref
# that isn't a `v<semver>` tag with a published GitHub release on this
# repository's `main`. The `bynk` release that the tag's commit pins in
# `bynk-toolchain` is installed, with its admission module, and both are checked
# against its SHA256SUMS; nothing is built from source.
#
# Staging deploys first and is held to the protocol: a full conformance run,
# a check of the edge cache with anonymous reads (an archive is a cache hit,
# and a takedown purges it), and a trusted-publishing exchange with this
# workflow's own OIDC token. Then
# production waits for an approval (the `registry-production` environment's
# required reviewers), deploys, and passes the read checks. A release
# candidate (`-rc`) goes to staging only. Rollback is deploying the previous
# tag.
#
# Every account id, token and key lives in the two GitHub environments, never
# in git (E3); `README.md`, "Deploying", lists them. Both
# environments allow deployments from `main` only: a dispatch runs the workflow
# file of the ref it names, so that rule, not this file, is what keeps an edited
# copy on another branch from reaching their secrets.
#
# The guard pins what it checked: the tag's commit, the toolchain that commit
# pins, and that toolchain release's digests. The jobs deploy that commit and verify those digests, so a tag moved
# or an asset replaced after the check (before the production approval, say)
# fails instead of deploying.
name: Deploy registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to deploy (vX.Y.Z, or vX.Y.Z-rc.N for staging only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-registry
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  guard:
    name: Check the tag is a release on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      production: ${{ steps.guard.outputs.production }}
      sha: ${{ steps.guard.outputs.sha }}
      toolchain: ${{ steps.guard.outputs.toolchain }}
      archive_sha256: ${{ steps.guard.outputs.archive_sha256 }}
      module_sha256: ${{ steps.guard.outputs.module_sha256 }}
    steps:
      - name: Refuse a dispatch from anything but main
        run: '[[ "$GITHUB_REF" == refs/heads/main ]] || { echo "dispatch this from main, not $GITHUB_REF" >&2; exit 1; }'
      # The guard comes from main, not from the tag being judged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: scripts/deploy-guard.sh check "$TAG" >> "$GITHUB_OUTPUT"

  staging:
    name: Deploy to staging, and hold it to the protocol
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: registry-staging
    permissions:
      contents: read
      id-token: write # the trusted-publishing exchange below
    steps:
      - name: Refuse a dispatch from anything but main
        run: '[[ "$GITHUB_REF" == refs/heads/main ]] || { echo "dispatch this from main, not $GITHUB_REF" >&2; exit 1; }'
      # The commit the guard checked, not the tag, which could have moved since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
      - name: Install the released toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN: ${{ needs.guard.outputs.toolchain }}
          ARCHIVE_SHA256: ${{ needs.guard.outputs.archive_sha256 }}
          MODULE_SHA256: ${{ needs.guard.outputs.module_sha256 }}
        run: |
          scripts/install-release.sh "$TOOLCHAIN" "$RUNNER_TEMP/bynk"
          echo "$RUNNER_TEMP/bynk" >> "$GITHUB_PATH"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
          REGISTRY_SIGNING_PUBLIC: ${{ secrets.REGISTRY_SIGNING_PUBLIC }}
          REGISTRY_TOKENS: ${{ secrets.REGISTRY_TOKENS }}
          REGISTRY_QUOTAS: ${{ secrets.REGISTRY_QUOTAS }}
          GITHUB_CLIENT_ID: ${{ secrets.REGISTRY_GITHUB_CLIENT_ID }}
          GITHUB_API_TOKEN: ${{ secrets.REGISTRY_GITHUB_API_TOKEN }}
        run: bynk deploy --env staging --yes
      - name: Conformance, in full
        env:
          URL: ${{ vars.REGISTRY_URL }}
          ORG: ${{ vars.REGISTRY_CONFORMANCE_ORG }}
          ROOT: ${{ vars.REGISTRY_ROOT_KEY }}
          BYNK_REGISTRY_CONFORMANCE_TOKEN: ${{ secrets.REGISTRY_CONFORMANCE_TOKEN }}
          NARROW: ${{ secrets.REGISTRY_NARROW_TOKEN }}
        # As JSON, so the next step can find the throwaway package it published.
        run: |
          status=0
          bynk registry conformance "$URL" --org "$ORG" --key "$ROOT" --narrow-token-env NARROW \
            --format json > "$RUNNER_TEMP/conformance.json" || status=$?
          jq -r '.checks[] | "\(.outcome)\t\(.id)\t\(.detail)"' "$RUNNER_TEMP/conformance.json"
          exit "$status"
      # Conformance checks what is served, never whether the edge served it, and
      # `bynk dev` has no edge cache, so this is the only place the cache is
      # checked (R6.1, bynk-lang/bynk#2413; ADR 0613 F). Its reads carry its
      # token, which doesn't bypass a `public` copy (ADR 0613 G); this step reads
      # with none, as a consumer does.
      # The archive of the version conformance just published: a second
      # anonymous fetch must be an edge hit; a takedown must purge it, so the
      # next fetch is the origin's 404, not the cached bytes.
      - name: The edge cache, anonymously (a hit, then a takedown purges it)
        env:
          URL: ${{ vars.REGISTRY_URL }}
          WITHDRAW: ${{ secrets.REGISTRY_WITHDRAW_TOKEN }}
        run: |
          [[ -n "$WITHDRAW" ]] || { echo "staging needs REGISTRY_WITHDRAW_TOKEN, a withdraw-only operator token, for the purge check" >&2; exit 1; }
          base="${URL%/}"
          package="$(jq -r '.published // empty' "$RUNNER_TEMP/conformance.json")"
          [[ -n "$package" ]] || { echo "conformance published no package" >&2; exit 1; }
          hex="$(curl -sf "$base/$package" | python3 -c '
          import base64, json, sys
          for l in sys.stdin:
              line = json.loads(l)
              if line["version"] == "0.0.1":
                  print(base64.b64decode(line["checksum"][7:]).hex())')"
          [[ -n "$hex" ]] || { echo "the index of $package has no 0.0.1" >&2; exit 1; }
          archive="$base/dl/sha256/$hex"
          cache_status() { curl -s -o /dev/null -D - "$archive" | tr -d '\r' | awk 'tolower($1) == "cf-cache-status:" { print toupper($2) }'; }
          # The first fetch may already hit: conformance fetched it too, and a
          # `public` answer to a request with a token is shared (ADR 0613 G).
          curl -sf -o /dev/null "$archive" || { echo "$archive isn't served" >&2; exit 1; }
          hit=
          for _ in 1 2 3; do
            seen="$(cache_status)"
            [[ "$seen" == HIT ]] && { hit=1; break; }
            sleep 2
          done
          [[ -n "$hit" ]] || { echo "a repeated anonymous fetch of $archive was \`${seen:-no cf-cache-status}\`, not HIT" >&2; exit 1; }
          echo "an anonymous fetch of $package 0.0.1's archive is an edge hit"
          status="$(curl -s -o takedown.json -w '%{http_code}' -X POST "$base/_operator/withdraw/$package/0.0.1" \
            -H "Authorization: Bearer $WITHDRAW" -H 'content-type: application/json' \
            --data '{"reason":"Withdrawn by the staging deploy check of the edge cache"}')"
          [[ "$status" == 200 && "$(jq -r .edge takedown.json)" == purged ]] ||
            { echo "the takedown was $status: $(jq -c . takedown.json)" >&2; exit 1; }
          rm -f takedown.json
          after="$(curl -s -o /dev/null -D - -w 'status:%{http_code}\n' "$archive" | tr -d '\r')"
          grep -q '^status:404$' <<<"$after" || { echo "after the takedown, $archive was still served: $after" >&2; exit 1; }
          if grep -qi '^cf-cache-status: *HIT' <<<"$after"; then echo "after the takedown, the edge still answered for $archive" >&2; exit 1; fi
          echo "the takedown purged it: the next fetch is the origin's 404"
      - name: Trusted publishing, with this job's own OIDC token
        env:
          URL: ${{ vars.REGISTRY_URL }}
          ORG: ${{ vars.REGISTRY_CONFORMANCE_ORG }}
        run: |
          oidc="$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bynk-registry" | jq -r .value)"
          [[ -n "$oidc" && "$oidc" != null ]] || { echo "GitHub issued no OIDC token" >&2; exit 1; }
          status="$(curl -s -o exchange.json -w '%{http_code}' -X POST "$URL/account/trusted/exchange" \
            -H "Authorization: Bearer $oidc" -H 'content-type: application/json' \
            --data "{\"org\":\"$ORG\"}")"
          [[ "$status" == 201 ]] || { echo "the exchange was $status: $(jq -c '{error, message}' exchange.json)" >&2; exit 1; }
          rm -f exchange.json
          echo "staging exchanged this job's OIDC token for a publish token"

  production:
    name: Deploy to production (approved)
    needs: [guard, staging]
    if: needs.guard.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: registry-production
    steps:
      - name: Refuse a dispatch from anything but main
        run: '[[ "$GITHUB_REF" == refs/heads/main ]] || { echo "dispatch this from main, not $GITHUB_REF" >&2; exit 1; }'
      # The commit the guard checked, not the tag, which could have moved since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
      - name: Install the released toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN: ${{ needs.guard.outputs.toolchain }}
          ARCHIVE_SHA256: ${{ needs.guard.outputs.archive_sha256 }}
          MODULE_SHA256: ${{ needs.guard.outputs.module_sha256 }}
        run: |
          scripts/install-release.sh "$TOOLCHAIN" "$RUNNER_TEMP/bynk"
          echo "$RUNNER_TEMP/bynk" >> "$GITHUB_PATH"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
          REGISTRY_SIGNING_PUBLIC: ${{ secrets.REGISTRY_SIGNING_PUBLIC }}
          REGISTRY_TOKENS: ${{ secrets.REGISTRY_TOKENS }}
          REGISTRY_QUOTAS: ${{ secrets.REGISTRY_QUOTAS }}
          GITHUB_CLIENT_ID: ${{ secrets.REGISTRY_GITHUB_CLIENT_ID }}
          GITHUB_API_TOKEN: ${{ secrets.REGISTRY_GITHUB_API_TOKEN }}
        run: bynk deploy --env production --yes
      - name: Conformance, read checks
        env:
          URL: ${{ vars.REGISTRY_URL }}
          ROOT: ${{ vars.REGISTRY_ROOT_KEY }}
          PACKAGE: ${{ vars.REGISTRY_PROBE_PACKAGE }}
        run: bynk registry conformance "$URL" --read-only --package "$PACKAGE" --key "$ROOT"
